<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-check-double"></i> <span>Pivotr</span>
            </div>

            <nav class="nav-menu">
                <p class="nav-title">FILTERS</p>
                <ul>
                    <li class="active" data-filter="all"><i class="fa-solid fa-list"></i> All Tasks</li>
                    <li data-filter="active"><i class="fa-regular fa-circle"></i> Pending</li>
                    <li data-filter="completed"><i class="fa-regular fa-circle-check"></i> Completed</li>
                </ul>

                <p class="nav-title">CATEGORIES</p>
                <ul>
                    <li data-category="Work"><i class="fa-solid fa-briefcase"></i> Work</li>
                    <li data-category="Personal"><i class="fa-solid fa-user"></i> Personal</li>
                    <li data-category="Shopping"><i class="fa-solid fa-cart-shopping"></i> Shopping</li>
                    <li data-category="Gym"><i class="fa-solid fa-dumbbell"></i> Gym</li>
                </ul>
            </nav>

            <div class="theme-toggle">
                <input type="checkbox" id="theme-switch">
                <label for="theme-switch" class="switch-label">
                    <i class="fa-solid fa-sun"></i>
                    <i class="fa-solid fa-moon"></i>
                    <div class="ball"></div>
                </label>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-text">
                    <h1 id="greeting">Hello, User!</h1>
                    <p id="current-date">Fetching date...</p>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>
            </header>

            <section class="task-input-section">
                <div class="input-card">
                    <div class="input-row">
                        <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
                        <button id="add-btn"><i class="fa-solid fa-plus"></i> Add</button>
                    </div>
                    <div class="input-actions">
                        <select id="category-select">
                            <option value="General">Category: General</option>
                            <option value="Work">Category: Work</option>
                            <option value="Personal">Category: Personal</option>
                            <option value="Shopping">Category: Shopping</option>
                            <option value="Gym">Category: Gym</option>
                        </select>
                        <select id="priority-select">
                            <option value="low">Priority: Low</option>
                            <option value="medium" selected>Priority: Medium</option>
                            <option value="high">Priority: High</option>
                        </select>
                        <input type="date" id="date-select" title="Due Date">
                    </div>
                </div>
            </section>

            <section class="tasks-section">
                <div class="section-header">
                    <h2 class="section-title">My Tasks <span id="task-count">0</span></h2>
                    <!-- Sorting or other controls could go here -->
                </div>

                <ul id="todo-list" class="task-list">
                    <!-- Tasks will be injected here -->
                </ul>
                <div id="empty-state" class="empty-state" style="display: none;">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <p>No tasks yet. Start by adding one!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content glass-modal">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title">Edit Task</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="edit-task" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="edit-category">
                            <option value="General">General</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Gym">Gym</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="edit-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="edit-date">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="edit-status">
                            <option value="active">Pending</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancel-edit">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-content small-modal glass-modal">
            <div class="modal-icon warning">
                <i class="fa-solid fa-exclamation-triangle"></i>
            </div>
            <h3>Delete Task?</h3>
            <p>Are you sure you want to delete this task? This action cannot be undone.</p>
            <div class="modal-actions center">
                <button class="btn-cancel" id="cancel-delete">Cancel</button>
                <button class="btn-danger" id="confirm-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
